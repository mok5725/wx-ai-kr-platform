<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 주보 글꼴(/fonts = ./data/jubo/fonts). 맑은 고딕·HY중고딕은 윈도·오피스 글꼴이라 서버에 두지 않고
     나눔바른고딕·나눔고딕으로 대신한다(앱의 app/jubo/lo_prepare.py STANDIN 과 같게). -->
<fontconfig>
  <dir>/fonts</dir>
  <alias binding="same">
    <family>맑은 고딕</family>
    <prefer><family>NanumBarunGothic</family></prefer>
  </alias>
  <alias binding="same">
    <family>Malgun Gothic</family>
    <prefer><family>NanumBarunGothic</family></prefer>
  </alias>
  <alias binding="same">
    <family>HY중고딕</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
</fontconfig>
